name: Cube Linux package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install pinned dependencies
        working-directory: collab-electron
        run: bun install --frozen-lockfile
      - name: Check session persistence
        working-directory: collab-electron
        run: bun test src/main/session-store.test.ts
      - name: Check native terminal sidecar
        working-directory: collab-electron
        run: bun x tsx --test src/main/sidecar/client.test.ts src/main/sidecar/server.test.ts
      - name: Build production Electron app
        working-directory: collab-electron
        run: |
          bun run build
          bun x electron-builder --linux --x64 --dir --publish never -c.npmRebuild=false
          cp ../LICENSE.md ../NOTICE.md dist/linux-unpacked/
          git rev-parse HEAD > dist/linux-unpacked/CUBE_BUILD_REVISION
          tar -czf dist/collaborator-linux-x64.tgz -C dist/linux-unpacked .
          cd dist
          sha256sum collaborator-linux-x64.tgz > collaborator-linux-x64.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collaborator-linux-x64
          path: |
            collab-electron/dist/collaborator-linux-x64.tgz
            collab-electron/dist/collaborator-linux-x64.sha256
          retention-days: 14
